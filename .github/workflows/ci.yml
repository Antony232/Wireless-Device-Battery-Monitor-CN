name: ci

# Fast check: does it compile and do the unit tests pass? No packaging, no downloads, no network.
# Packages (installer, portable zip) are built only for release tags, see release.yml.
# Documentation-only pushes are ignored so a README fix does not queue a 3-minute build.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# A new push to the same branch cancels the previous, still running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        run: make

      - name: Run unit tests
        shell: msys2 {0}
        run: make test

      # Only the executable is kept: enough to download and try a pull request build.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBattery-CN-exe
          path: WirelessBattery.exe
          if-no-files-found: error
